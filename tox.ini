[tox]
envlist =
    py{312,313,314}-django{52,60,61}-{chromium,firefox,webkit}
    py{312,313,314}-django{52,60,61}-nofiler
    ruff
    docs
    # typecheck
skip_missing_interpreters = true

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
DJANGO =
    5.2: django52
    6.0: django60
    6.1: django61
PLAYWRIGHT_BROWSER =
    chromium: chromium
    firefox: firefox
    webkit: webkit
VARIANT =
    nofiler: nofiler

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE=testapp.settings
    PYTHONPATH={toxinidir}
    chromium: PLAYWRIGHT_BROWSER=chromium
    firefox: PLAYWRIGHT_BROWSER=firefox
    webkit: PLAYWRIGHT_BROWSER=webkit
extras =
    tests
    !nofiler: images
deps =
  django52: Django~=5.2.0
  django60: Django~=6.0.0
  django61: Django~=6.1.0
  {chromium,firefox,webkit}: playwright
commands_pre =
  {chromium,firefox,webkit}: playwright install --force {env:PLAYWRIGHT_BROWSER}
commands =
  py.test tests \
   --cov --cov-report xml:reports/coverage-{envname}.xml \
   {chromium,firefox,webkit}: --browser={env:PLAYWRIGHT_BROWSER} \
   {chromium,firefox,webkit}: -m "not nofiler" \
   nofiler: -m nofiler \
   {posargs}

[testenv:ruff]
extras = tests
skipsdist = True
commands =
    ruff check --output-format=github .
    ruff format --check

[testenv:docs]
basepython=python
changedir=docs
skipsdist=true
extras =
    tests
    docs
allowlist_externals = make
commands=
    make SPHINXOPTS="-W" html
    make linkcheck

[testenv:typecheck]
basepython=python
skipsdist=true
extras =
    tests
commands = pyright
